        function getCurrentSection() {
            const secId = state.selectedSectionIds[state.currentSectionIdx];

            const sec = getCurrentSection();

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        /**
         * Konversi Raw Score ke ETS TOEFL ITP Scaled Score (31 - 68 per section)
         * dan Total Score (310 - 677).
         */
        function calculateETSScore(correct, total) {
            if (total === 0) return 31;
            const ratio = correct / total;
            // Skala TOEFL ITP berkisar antara 31 (0%) hingga 68 (100%)
            // Menggunakan kurva interpolasi realistis mendekati tabel konversi ETS
            const scaled = Math.round(31 + (ratio * 37));
            return Math.min(68, Math.max(31, scaled));
        }

        function getCEFRLevel(totalScore) {
            if (totalScore >= 627) return { level: 'C1', label: 'Effective Operational Proficiency', color: 'text-emerald-700 bg-emerald-50 border-emerald-200' };
            if (totalScore >= 543) return { level: 'B2', label: 'Vantage / Upper Intermediate', color: 'text-blue-700 bg-blue-50 border-blue-200' };
            if (totalScore >= 460) return { level: 'B1', label: 'Threshold / Intermediate', color: 'text-amber-700 bg-amber-50 border-amber-200' };
            if (totalScore >= 337) return { level: 'A2', label: 'Waystage / Elementary', color: 'text-orange-700 bg-orange-50 border-orange-200' };
            return { level: 'A1', label: 'Breakthrough / Beginner', color: 'text-slate-700 bg-slate-100 border-slate-200' };

            } else if (type === 'danger') {
                iconBox.className = 'w-11 h-11 rounded-xl flex items-center justify-center shrink-0 bg-red-50 text-red-600';
                iconBox.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
            } else {

            }

            confirmBtn.className = type === 'danger'
                ? 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-red-600 hover:bg-red-700 shadow-sm transition-colors'
                : 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors';
            confirmBtn.textContent = confirmText;
            confirmBtn.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };
            actionsEl.appendChild(confirmBtn);

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /**
         * =====================================================================
         * 4. TIMER ENGINE (ETS STANDARD COUNTDOWN)
         * =====================================================================
         */
        function startSectionTimer(seconds) {
            stopTimer();
            state.timerSeconds = seconds;
            state.timerPaused = false;
            updateTimerUI();

            state.timerInterval = setInterval(() => {
                if (state.timerPaused) return;

                state.timerSeconds--;
                updateTimerUI();

                if (state.timerSeconds <= 0) {
                    stopTimer();
                    stopAudio();
                    showModal({
                        title: 'Waktu Sesi Habis!',
                        message: `Waktu standar ETS untuk sesi ${getCurrentSection().title} telah berakhir. Jawaban Anda disimpan secara otomatis.`,
                        type: 'warning',
                        confirmText: 'Lanjut ke Tahap Berikutnya',
                        cancelText: null,
                        onConfirm: () => advanceSectionOrFinish()
                    });
                }
            }, 1000);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('ets-timer-display');
            const timerBox = document.getElementById('ets-timer-box');
            if (!timerEl || !timerBox) return;

            timerEl.textContent = formatTime(Math.max(0, state.timerSeconds));

            // Peringatan visual sesuai sisa waktu
            if (state.timerSeconds <= 60) {
                timerBox.className = 'flex items-center gap-2 px-3.5 py-1.5 rounded-xl font-mono text-sm sm:text-base font-bold border bg-red-50 text-red-700 border-red-200 animate-pulse';
            } else if (state.timerSeconds <= 300) {
                timerBox.className = 'flex items-center gap-2 px-3.5 py-1.5 rounded-xl font-mono text-sm sm:text-base font-bold border bg-amber-50 text-amber-700 border-amber-200';
            } else {
                timerBox.className = 'flex items-center gap-2 px-3.5 py-1.5 rounded-xl font-mono text-sm sm:text-base font-bold border bg-slate-100 text-slate-800 border-slate-200';
            }
        }

        /**
         * =====================================================================
         * 5. WEB SPEECH API (SIMULASI AUDIO LISTENING)
         * =====================================================================
         */
        function stopAudio() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            } catch (e) {
                console.warn('SpeechSynthesis cancel warning:', e);
            }
            state.isSpeaking = false;
            const waveEl = document.getElementById('audio-waveform');
            if (waveEl) waveEl.classList.add('wave-paused');
            const btnText = document.getElementById('audio-btn-text');
            if (btnText) btnText.textContent = 'Putar Audio Soal';
        }

        function playListeningAudio(question) {
            if (!('speechSynthesis' in window)) {
                showModal({
                    title: 'Browser Tidak Mendukung Audio TTS',
                    message: 'Browser Anda tidak mendukung Web Speech API. Silakan gunakan Chrome/Edge/Safari atau buka Transkrip di Mode Latihan.',
                    type: 'warning',
                    confirmText: 'Mengerti',
                    cancelText: null
                });
                return;
            }

            // Pada Full Simulation Mode (standar ETS), audio hanya boleh diputar 1 kali
            const played = state.audioPlayCount[question.id] || 0;
            if (state.mode === 'full' && played >= 1 && !state.isSpeaking) {
                showModal({
                    title: 'Aturan Standar ETS',
                    message: 'Pada mode Simulasi Penuh TOEFL ITP, rekaman audio hanya diperbolehkan diputar satu kali (1x) per soal.',
                    type: 'info',
                    confirmText: 'Mengerti',
                    cancelText: null
                });
                return;
            }

            if (state.isSpeaking) {
                stopAudio();
                return;
            }

            stopAudio();
            state.audioPlayCount[question.id] = played + 1;
            state.isSpeaking = true;

            // Update UI tombol & waveform
            const waveEl = document.getElementById('audio-waveform');
            if (waveEl) waveEl.classList.remove('wave-paused');
            const btnText = document.getElementById('audio-btn-text');
            if (btnText) btnText.textContent = 'Hentikan Audio';

            const voices = window.speechSynthesis.getVoices();
            const enVoices = voices.filter(v => v.lang.startsWith('en'));

            let idx = 0;
            const speakNext = () => {
                if (!state.isSpeaking || idx >= question.audioScript.length) {
                    stopAudio();
                    // Re-render badge jumlah putar jika masih di halaman tes
                    if (state.view === 'test') {
                        const playStatus = document.getElementById('audio-play-status');
                        if (playStatus) {
                            const count = state.audioPlayCount[question.id] || 0;
                            playStatus.textContent = state.mode === 'full'
                                ? (count >= 1 ? 'Sudah diputar (1/1 — Standar ETS)' : 'Kesempatan putar: 1x')
                                : `Diputar ${count}x (Mode Latihan: Tanpa Batas)`;
                        }
                    }
                    return;
                }

                const line = question.audioScript[idx];
                const utter = new SpeechSynthesisUtterance(line.text);
                utter.lang = 'en-US';
                utter.rate = 0.96;

                // Variasi pitch untuk membedakan narator, pria, dan wanita
                if (line.role === 'woman') {
                    utter.pitch = 1.15;
                    if (enVoices[1]) utter.voice = enVoices[1];
                } else if (line.role === 'man') {
                    utter.pitch = 0.88;
                    if (enVoices[0]) utter.voice = enVoices[0];
                } else {
                    utter.pitch = 1.0;
                    if (enVoices[2] || enVoices[0]) utter.voice = enVoices[2] || enVoices[0];
                }

                utter.onend = () => {
                    idx++;
                    setTimeout(speakNext, 350);
                };
                utter.onerror = () => {
                    stopAudio();
                };

                window.speechSynthesis.speak(utter);
            };

            speakNext();
        }

        /**
         * =====================================================================
         * 6. NAVIGATION & TEST FLOW CONTROLLERS
         * =====================================================================
         */
        function startExam(mode, sectionId = null) {
            stopTimer();
            stopAudio();

            state.mode = mode;
            state.answers = {};
            state.flagged = {};
            state.audioPlayCount = {};
            state.showTranscript = false;
            state.currentSectionIdx = 0;
            state.currentQuestionIdx = 0;
            state.reviewFilter = 'all';

            if (mode === 'full') {
                state.selectedSectionIds = ['listening', 'structure', 'reading'];
            } else {
                state.selectedSectionIds = [sectionId];
            }

            state.view = 'directions';
            render();
        }

        function beginCurrentSection() {
            const sec = getCurrentSection();
            state.currentQuestionIdx = 0;
            state.showTranscript = false;
            state.view = 'test';
            render();
            startSectionTimer(sec.etsDurationSeconds);
        }

        function selectAnswer(questionId, optionIndex) {
            state.answers[questionId] = optionIndex;
            render();
        }

        function toggleFlag(questionId) {
            state.flagged[questionId] = !state.flagged[questionId];
            render();
        }

        function goToQuestion(idx) {
            const qs = getCurrentQuestions();
            if (idx >= 0 && idx < qs.length) {
                stopAudio();
                state.currentQuestionIdx = idx;
                state.showTranscript = false;
                state.mobilePaletteOpen = false;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function confirmFinishSection() {
            const sec = getCurrentSection();
            const qs = getCurrentQuestions();
            const answeredCount = qs.filter(q => state.answers[q.id] !== undefined).length;
            const unanswered = qs.length - answeredCount;
            const isLastSection = state.currentSectionIdx >= state.selectedSectionIds.length - 1;

            showModal({
                title: isLastSection ? 'Selesaikan Ujian & Lihat Skor?' : `Akhiri Sesi ${sec.shortTitle}?`,
                message: unanswered > 0
                    ? `Anda masih memiliki ${unanswered} soal yang belum dijawab pada sesi ini. Sesuai aturan ETS, Anda tidak dapat kembali ke sesi ini setelah melanjutkannya.`
                    : `Semua ${qs.length} soal pada sesi ini telah terjawab. Lanjutkan sekarang?`,
                type: unanswered > 0 ? 'warning' : 'info',
                confirmText: isLastSection ? 'Selesaikan & Hitung Skor' : 'Lanjut Sesi Berikutnya',
                cancelText: 'Periksa Kembali',
                onConfirm: () => advanceSectionOrFinish()
            });
        }

        function advanceSectionOrFinish() {
            stopTimer();
            stopAudio();

            if (state.currentSectionIdx < state.selectedSectionIds.length - 1) {
                state.currentSectionIdx++;
                state.currentQuestionIdx = 0;
                state.view = 'directions';
                render();
            } else {
                state.view = 'result';
                render();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function confirmExitToHome() {
            showModal({
                title: 'Keluar dari Sesi Ujian?',
                message: 'Progres jawaban dan waktu pada sesi ini akan direset jika Anda kembali ke halaman utama.',
                type: 'danger',
                confirmText: 'Ya, Keluar',
                cancelText: 'Lanjut Mengerjakan',
                onConfirm: () => {
                    stopTimer();
                    stopAudio();
                    state.view = 'home';
                    render();
                }
            });
        }

        /**
         * =====================================================================
         * 7. VIEW RENDERERS
         * =====================================================================
         */
        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') {
                app.innerHTML = renderHomeView();
            } else if (state.view === 'directions') {
                app.innerHTML = renderDirectionsView();
            } else if (state.view === 'test') {
                app.innerHTML = renderTestView();
                updateTimerUI();
            } else if (state.view === 'result') {
                app.innerHTML = renderResultView();
            }
        }

                                </button>

        /**

        function renderTestView() {
            const sec = getCurrentSection();
            const qs = getCurrentQuestions();

            const selectedAns = state.answers[q.id];

                        <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
                            <button onclick="confirmExitToHome()" title="Keluar" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors shrink-0">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                            </button>
                            <div class="min-w-0">

                            <div id="ets-timer-box" class="flex items-center gap-1.5 sm:gap-2 px-3 py-1.5 rounded-xl font-mono text-sm sm:text-base font-bold border bg-slate-100 text-slate-800 border-slate-200">
                                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span id="ets-timer-display">${formatTime(state.timerSeconds)}</span>
                            </div>

                            <button onclick="state.mobilePaletteOpen = !state.mobilePaletteOpen; render();" class="lg:hidden p-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50" aria-label="Navigasi Soal">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            </button>

                            <button onclick="confirmFinishSection()" class="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-bold transition-colors">

                    </div>
                    <!-- Thin Progress Bar -->

                        ${sec.id === 'reading' ? renderReadingSplitLayout(q, selectedAns, isFlagged) : renderStandardQuestionCard(sec, q, selectedAns, isFlagged)}

                        <!-- Bottom Navigation Controls -->
                        <div class="mt-5 flex items-center justify-between gap-2 bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <button onclick="goToQuestion(${state.currentQuestionIdx - 1})" ${state.currentQuestionIdx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                                <span class="hidden sm:inline">Sebelumnya</span>
                            </button>

                            <button onclick="toggleFlag('${q.id}')" class="px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-colors ${isFlagged ? 'bg-amber-50 border-amber-300 text-amber-800' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">
                                <svg class="w-4 h-4" fill="${isFlagged ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
                                ${isFlagged ? 'Ditandai' : 'Tandai Ragu'}
                            </button>

                            ${!isLastQ ? `
                                <button onclick="goToQuestion(${state.currentQuestionIdx + 1})" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold flex items-center gap-1.5 shadow-sm transition-colors">
                                    <span>Selanjutnya</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                </button>
                            ` : `

                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                                </button>
                            `}

                    <!-- Desktop Right Sidebar: Question Palette -->
                    <aside class="hidden lg:block w-72 shrink-0">
                        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm sticky top-24">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Navigasi Soal</h3>
                            ${renderPaletteGrid(qs)}
                            
                            <div class="mt-5 pt-4 border-t border-slate-100 space-y-2 text-xs text-slate-600">
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-blue-600 inline-block"></span> Sudah dijawab</div>
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-amber-400 inline-block"></span> Ditandai ragu-ragu</div>
                                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-300 inline-block"></span> Belum dijawab</div>
                            </div>

                            <button onclick="confirmFinishSection()" class="mt-5 w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold transition-colors">
                                ${state.currentSectionIdx < state.selectedSectionIds.length - 1 ? 'Akhiri Sesi Ini' : 'Kumpulkan Jawaban'}
                            </button>
                        </div>
                    </aside>
                </main>
            `;
        }

        function renderPaletteGrid(qs) {
            return `
                <div class="grid grid-cols-5 gap-2">
                    ${qs.map((item, idx) => {
                        const isCurrent = idx === state.currentQuestionIdx;
                        const isAns = state.answers[item.id] !== undefined;
                        const isFlg = !!state.flagged[item.id];

                        let style = 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
                        if (isFlg) {
                            style = 'bg-amber-100 text-amber-900 border-amber-300 font-bold';
                        } else if (isAns) {
                            style = 'bg-blue-600 text-white border-blue-600 font-bold';
                        }
                        if (isCurrent) {
                            style += ' ring-2 ring-offset-2 ring-blue-500';
                        }

                        return `
                            <button onclick="goToQuestion(${idx})" class="h-10 rounded-xl border text-xs transition-all ${style}">
                                ${idx + 1}
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        /**
         * STANDARD CARD FOR LISTENING & STRUCTURE
         */
        function renderStandardQuestionCard(sec, q, selectedAns, isFlagged) {
            const playCount = state.audioPlayCount[q.id] || 0;

            return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
                        <span class="px-3 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-bold">${q.part}</span>
                        <span class="text-xs font-semibold text-slate-400">Nomor ${state.currentQuestionIdx + 1}</span>
                    </div>

                    ${sec.id === 'listening' ? `
                        <!-- Interactive Audio Player Box -->
                        <div class="mt-5 p-4 sm:p-5 rounded-2xl bg-slate-900 text-white flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                <button onclick='playListeningAudio(QUESTION_BANK.listening[${state.currentQuestionIdx}])' class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm flex items-center gap-2 shrink-0 transition-colors shadow-md">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    <span id="audio-btn-text">${state.isSpeaking ? 'Hentikan Audio' : 'Putar Audio Soal'}</span>
                                </button>
                                <div id="audio-waveform" class="flex items-center gap-1 h-7 ${state.isSpeaking ? '' : 'wave-paused'}">
                                    <span class="wave-bar w-1 bg-blue-400 rounded-full"></span>
                                    <span class="wave-bar w-1 bg-blue-300 rounded-full"></span>
                                    <span class="wave-bar w-1 bg-blue-400 rounded-full"></span>
                                    <span class="wave-bar w-1 bg-blue-300 rounded-full"></span>
                                    <span class="wave-bar w-1 bg-blue-400 rounded-full"></span>
                                </div>
                            </div>
                            <div class="text-xs text-slate-300 w-full sm:w-auto text-left sm:text-right">
                                <div id="audio-play-status" class="font-medium">
                                    ${state.mode === 'full'
                                        ? (playCount >= 1 ? 'Sudah diputar (1/1 — Standar ETS)' : 'Kesempatan putar: 1x')
                                        : `Diputar ${playCount}x (Mode Latihan: Tanpa Batas)`}
                                </div>
                                ${state.mode === 'practice' ? `
                                    <button onclick="state.showTranscript = !state.showTranscript; render();" class="mt-1 text-blue-300 hover:text-blue-200 underline font-semibold">
                                        ${state.showTranscript ? 'Sembunyikan Transkrip' : 'Tampilkan Transkrip (Latihan)'}
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        ${state.mode === 'practice' && state.showTranscript ? `
                            <div class="mt-3 p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm space-y-1.5">
                                <div class="font-bold text-slate-500 uppercase text-[11px] mb-1">Audio Script</div>
                                ${q.audioScript.map(line => `
                                    <p class="text-slate-700"><strong class="capitalize text-slate-900">(${line.role}):</strong> ${line.text}</p>
                                `).join('')}
                            </div>
                        ` : ''}
                    ` : ''}

                    <!-- Question Stem -->
                    <div class="mt-6">
                        ${q.type === 'written_expression' ? `
                            <p class="text-xs sm:text-sm text-slate-500 mb-3">${q.prompt}</p>
                            <div class="text-base sm:text-lg text-slate-900 leading-loose bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200">
                                ${q.segments.map(seg => {
                                    if (typeof seg === 'string') return `<span>${seg}</span>`;
                                    return `<span class="we-segment"><span class="we-text">${seg.text}</span><span class="we-label">(${seg.label})</span></span>`;
                                }).join('')}
                            </div>
                        ` : `
                            <p class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">${q.question}</p>
                        `}
                    </div>

                    <!-- Answer Choices -->
                    <div class="mt-6 space-y-3">
                        ${renderOptionsList(q, selectedAns)}
                    </div>
                </div>
            `;
        }

        /**
         * SPLIT-SCREEN LAYOUT FOR READING COMPREHENSION
         */
        function renderReadingSplitLayout(q, selectedAns, isFlagged) {
            const passage = READING_PASSAGES[q.passageId];

            return `
                <div class="grid grid-cols-1 xl:grid-cols-12 gap-5">
                    <!-- Left: Reading Passage with ETS Line Numbers -->
                    <div class="xl:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                        <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-teal-700">${q.part}</span>
                            <span class="text-xs font-semibold text-slate-500">${passage.title}</span>
                        </div>
                        <div class="p-5 sm:p-6 max-h-[340px] xl:max-h-[540px] overflow-y-auto custom-scroll text-sm sm:text-[15px] leading-7 text-slate-800">
                            <h4 class="font-bold text-slate-900 text-base mb-3">${passage.title}</h4>
                            <div class="space-y-0.5 font-normal">
                                ${passage.lines.map((line, i) => {
                                    const lineNum = i + 1;
                                    const showNum = lineNum % 5 === 0 || lineNum === 1;
                                    return `
                                        <div class="flex items-start gap-3">
                                            <span class="w-7 shrink-0 text-right font-mono text-[11px] text-slate-400 select-none pt-0.5">
                                                ${showNum ? `(${lineNum})` : ''}
                                            </span>
                                            <span class="flex-1 whitespace-pre-wrap">${line}</span>

                                    `;

                        </div>
                    </div>

                    <!-- Right: Reading Question & Choices -->
                    <div class="xl:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                                <span class="text-xs font-bold text-slate-500 uppercase">Pertanyaan ${state.currentQuestionIdx + 1}</span>
                                <span class="text-xs text-slate-400">Reading Comprehension</span>
                            </div>
                            <p class="mt-4 text-base font-semibold text-slate-900 leading-relaxed">${q.question}</p>
                            <div class="mt-5 space-y-2.5">

                            </div>
                        </div>
                    </div>

        }

        function renderOptionsList(q, selectedAns) {
            const letters = ['A', 'B', 'C', 'D'];
            return q.options.map((opt, idx) => {
                const isSelected = selectedAns === idx;
                return `
                    <button onclick="selectAnswer('${q.id}', ${idx})" class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition-all flex items-start gap-3.5 ${isSelected ? 'border-blue-600 bg-blue-50/70 shadow-sm' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'}">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 transition-colors ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">
                            ${letters[idx]}
                        </span>
                        <span class="text-sm sm:text-[15px] ${isSelected ? 'font-semibold text-blue-950' : 'text-slate-700'} leading-snug pt-0.5">
                            ${opt}
                        </span>
                    </button>
                `;
            }).join('');
        }

        /**
         * VIEW 4: ETS SCORE REPORT & ANSWER REVIEW (PEMBAHASAN)
         */
        function renderResultView() {
            // Hitung skor per section yang dikerjakan
            const sectionResults = state.selectedSectionIds.map(secId => {
                const sec = ETS_CONFIG.sections.find(s => s.id === secId);
                const qs = QUESTION_BANK[secId];
                let correct = 0;
                qs.forEach(q => {
                    if (state.answers[q.id] === q.correctIndex) correct++;
                });
                const scaled = calculateETSScore(correct, qs.length);
                return { sec, qs, correct, total: qs.length, scaled };
            });

            // Hitung Total TOEFL ITP Score (310 - 677)
            let totalScaledScore = 0;
            if (sectionResults.length === 3) {
                const sum = sectionResults.reduce((acc, r) => acc + r.scaled, 0);
                totalScaledScore = Math.min(677, Math.round((sum * 10) / 3));
            } else {
                // Estimasi proyeksi total jika hanya mengerjakan 1 sesi latihan
                totalScaledScore = Math.min(677, sectionResults[0].scaled * 10);
            }

            const cefr = getCEFRLevel(totalScaledScore);
            const allQuestions = sectionResults.flatMap(r => r.qs.map(q => ({ ...q, sectionTitle: r.sec.shortTitle })));
            const filteredQuestions = allQuestions.filter(q => {
                const isCorrect = state.answers[q.id] === q.correctIndex;
                if (state.reviewFilter === 'correct') return isCorrect;
                if (state.reviewFilter === 'incorrect') return !isCorrect;
                return true;
            });

            const letters = ['A', 'B', 'C', 'D'];

            return `
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
                    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-slate-900 text-white font-extrabold text-xs flex items-center justify-center">ITP</div>
                            <span class="font-bold text-slate-900 text-sm sm:text-base">Laporan Skor & Pembahasan</span>
                        </div>
                        <button onclick="state.view = 'home'; render();" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold transition-colors">
                            Kembali ke Beranda
                        </button>
                    </div>
                </header>

                <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">
                    <!-- ETS Score Card -->
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden">
                        <div class="bg-gradient-to-r from-slate-900 to-blue-950 p-6 sm:p-8 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-blue-300">
                                    ${state.mode === 'full' ? 'Official-Style TOEFL ITP® Score Estimate' : 'Estimasi Skor Sesi Latihan'}
                                </span>
                                <h2 class="text-2xl sm:text-3xl font-extrabold mt-1">Hasil Evaluasi Anda</h2>
                                <p class="text-slate-300 text-xs sm:text-sm mt-1">
                                    Dihitung menggunakan formula skala ETS: <code class="text-blue-200">((S1 + S2 + S3) × 10) / 3</code>
                                </p>
                            </div>
                            <div class="flex items-center gap-5 bg-white/10 border border-white/15 rounded-2xl px-6 py-4 backdrop-blur-sm">
                                <div class="text-center">
                                    <span class="text-[11px] uppercase tracking-wider text-blue-200 block">Total Score</span>
                                    <span class="text-4xl sm:text-5xl font-black tracking-tight text-white">${totalScaledScore}</span>
                                    <span class="text-[11px] text-slate-300 block mt-0.5">Skala 310 – 677</span>
                                </div>
                                <div class="h-12 w-px bg-white/20"></div>
                                <div>
                                    <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-extrabold border ${cefr.color}">CEFR ${cefr.level}</span>
                                    <div class="text-xs text-slate-200 mt-1.5 max-w-[140px] leading-snug">${cefr.label}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Section Breakdown -->
                        <div class="p-6 sm:p-8 grid grid-cols-1 sm:grid-cols-${sectionResults.length} gap-4">
                            ${sectionResults.map(r => `
                                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                                    <div>
                                        <div class="text-xs font-bold text-slate-500">Section ${r.sec.number}</div>
                                        <div class="font-bold text-slate-900 text-sm sm:text-base">${r.sec.shortTitle}</div>
                                        <div class="text-xs text-slate-500 mt-1">Benar: <strong class="text-slate-800">${r.correct}/${r.total}</strong></div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-[10px] uppercase font-bold text-slate-400 block">Scaled</span>
                                        <span class="text-2xl font-black text-blue-700">${r.scaled}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Review & Explanations -->
                    <div class="mt-8">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <h3 class="text-lg font-extrabold text-slate-900">Pembahasan & Kunci Jawaban</h3>
                            <div class="flex items-center gap-1.5 bg-white p-1 rounded-xl border border-slate-200 self-start">
                                ${[
                                    { id: 'all', label: 'Semua' },
                                    { id: 'correct', label: 'Benar' },
                                    { id: 'incorrect', label: 'Salah' }
                                ].map(tab => `
                                    <button onclick="state.reviewFilter = '${tab.id}'; render();" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${state.reviewFilter === tab.id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}">
                                        ${tab.label}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="space-y-4">
                            ${filteredQuestions.length === 0 ? `
                                <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-sm text-slate-500">
                                    Tidak ada soal pada kategori filter ini.
                                </div>
                            ` : filteredQuestions.map((q, i) => {
                                const userAns = state.answers[q.id];
                                const isCorrect = userAns === q.correctIndex;

                                return `
                                    <div class="bg-white rounded-2xl border ${isCorrect ? 'border-emerald-200' : 'border-red-200'} p-5 shadow-sm">
                                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                                            <div class="flex items-center gap-2">
                                                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold ${isCorrect ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
                                                    ${isCorrect ? '✓ Benar' : '✕ Salah'}
                                                </span>
                                                <span class="text-xs font-semibold text-slate-500">${q.sectionTitle} • ${q.id}</span>
                                            </div>
                                            <span class="text-[11px] font-semibold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-md">${q.skill}</span>
                                        </div>

                                        <p class="text-sm font-semibold text-slate-900">
                                            ${q.type === 'written_expression'
                                                ? q.segments.map(s => typeof s === 'string' ? s : `<u>${s.text}</u> (${s.label})`).join('')
                                                : q.question}
                                        </p>

                                        <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                            <div class="p-2.5 rounded-xl ${isCorrect ? 'bg-emerald-50 text-emerald-900' : 'bg-red-50 text-red-900'}">
                                                <span class="font-bold block">Jawaban Anda:</span>
                                                ${userAns !== undefined ? `(${letters[userAns]}) ${q.options[userAns]}` : 'Tidak dijawab'}
                                            </div>
                                            <div class="p-2.5 rounded-xl bg-emerald-50 text-emerald-900">
                                                <span class="font-bold block">Kunci Jawaban:</span>
                                                (${letters[q.correctIndex]}) ${q.options[q.correctIndex]}
                                            </div>
                                        </div>

                                        <div class="mt-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-700 leading-relaxed">
                                            <strong class="text-slate-900">Pembahasan:</strong> ${q.explanation}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </main>
            `;
        }

        /**
         * =====================================================================
         * 8. INITIALIZE APPLICATION
         * =====================================================================
         */
        window.addEventListener('DOMContentLoaded', () => {
            // Preload Web Speech voices
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
            render();
        });
    </script>
</body>
</html>
